[project]
name = "fala-audio-check"
version = "0.1.0"
description = "Measurement harness proving Fala audio renders meet their spec"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "soundfile>=0.12", "pyloudnorm>=0.1.1"]

[project.scripts]
fala-audio-check = "fala_audio_check.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fala_audio_check"]
